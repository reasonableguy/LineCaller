<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Data Fetch</title>
  <style>
    div {
      font-size: 24px;
      font-weight: bold;
      color: blue;
      margin: 20px;
    }
  </style>
</head>
<body>

  <div class="i2">Loading...</div>
  <div class="t2">Loading...</div>
  <div class="y2">Loading...</div>
  <div class="m14">Loading...</div>
  <div class="u14">Loading...</div>
  <div class="a8">Loading...</div>
  <div class="a10">Loading...</div>
  <div class="f8">Loading...</div>
  <div class="f10">Loading...</div>
  <div class="k8">Loading...</div>
  <div class="k10">Loading...</div>
  <div class="p8">Loading...</div>
  <div class="p10">Loading...</div>
  <div class="u8">Loading...</div>
  <div class="u10">Loading...</div>
  <div class="z8">Loading...</div>
  <div class="z10">Loading...</div>

  <!-- Buttons to run Google Apps Script functions -->
  <button onclick="triggerFunction('addUS')">Add US</button>
  <button onclick="triggerFunction('addTHEM')">Add THEM</button>
  <button onclick="triggerFunction('lessUS')">Less US</button>
  <button onclick="triggerFunction('lessTHEM')">Less THEM</button>

  <script>
    // Fetch data from Google Apps Script Web App (no callback in URL)
    function fetchData() {
      fetch('https://script.google.com/macros/s/AKfycbxDjmMiKVi6F00N77oVV1nkvUm_ky5yYeCrmSTHSj2wOgSwfA1_xkNhEndccIf_mM5a7Q/exec')  // Remove callback parameter here
        .then(response => response.json())  // Parse JSON data
        .then(data => {
          console.log("Data received:", data);  // Log data to console

          // Fill the divs with corresponding data
          document.querySelector('.i2').innerText = data.i2 || 'No data for I2';
          document.querySelector('.t2').innerText = data.t2 || 'No data for T2';
          document.querySelector('.y2').innerText = data.y2 || 'No data for Y2';
          document.querySelector('.m14').innerText = data.m14 || 'No data for M14';
          document.querySelector('.u14').innerText = data.u14 || 'No data for U14';
          document.querySelector('.a8').innerText = data.a8 || 'No data for A8';
          document.querySelector('.a10').innerText = data.a10 || 'No data for A10';
          document.querySelector('.f8').innerText = data.f8 || 'No data for F8';
          document.querySelector('.f10').innerText = data.f10 || 'No data for F10';
          document.querySelector('.k8').innerText = data.k8 || 'No data for K8';
          document.querySelector('.k10').innerText = data.k10 || 'No data for K10';
          document.querySelector('.p8').innerText = data.p8 || 'No data for P8';
          document.querySelector('.p10').innerText = data.p10 || 'No data for P10';
          document.querySelector('.u8').innerText = data.u8 || 'No data for U8';
          document.querySelector('.u10').innerText = data.u10 || 'No data for U10';
          document.querySelector('.z8').innerText = data.z8 || 'No data for Z8';
          document.querySelector('.z10').innerText = data.z10 || 'No data for Z10';
        })
        .catch(error => {
          console.error('Fetch error:', error);
        });
    }

    // Run Google Apps Script functions via button clicks
    function triggerFunction(functionName) {
      google.script.run[functionName]();  // Call the function on Google Apps Script
    }

    // Call fetchData to load the data on page load
    window.onload = fetchData;
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Data Fetch</title>
  <style>
    .point {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin: 20px;
    }
    .gender {
      font-size: 20px;
      color: #555;
      margin: 20px;
    }
  </style>
</head>
<body>

  <div class="point">Loading...</div>
  <div class="gender">Loading...</div>

  <script>
    // Your script URL generated by the Google Apps Script Web App
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxaPwHbD81lzETV3vHf38qXcFe1QboEZ6p4Pfd8cLVSc4Fo7LeMIllSTWfYsgsND-aziA/exec'; // Replace this with your actual URL

    // Function to fetch and render the cell data
    window.onload = function() {
      fetch(scriptURL)
        .then(response => response.json())
        .then(data => {
          // Display the value from I2 inside the div with class "point"
          document.querySelector('.point').textContent = data.i2;
          
          // Display the value from T2 inside the div with class "gender"
          document.querySelector('.gender').textContent = data.t2;
        })
        .catch(error => {
          console.error('Error fetching data:', error);
          document.querySelector('.point').textContent = 'Failed to load data for I2';
          document.querySelector('.gender').textContent = 'Failed to load data for T2';
        });
    };
  </script>

</body>
</html>

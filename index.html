<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Data Fetch</title>
  <style>
    .field {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin: 20px;
    }

  </style>
</head>
<body>

  <div class="field point">Loading...</div>
  <div class="field gender">Loading...</div>
   <div class="field od">Loading...</div>
    <div class="field players><p class="player1 player name">Loading...</p></div>

<script>
  function handleSheetData(data) {
    document.querySelector('.point').innerText = data.point;
    document.querySelector('.gender').innerText = data.gender;
     document.querySelector('.od').innerText = data.od;
    document.querySelector('.player1').innerText = data.player1;
  }
</script>

<script src="https://script.google.com/macros/s/AKfycby-P5mTRLSMClzzxEF7ExVFPXSybY95QhIL9BSU1d7t60Mz_vz6awJyIoxyLAg-aaw3_w/exec?callback=handleSheetData"></script>

</body>
</html>

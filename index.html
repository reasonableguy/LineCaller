<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Data Fetch</title>
  <style>
    .field {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin: 20px;
    }
  </style>
</head>
<body>

  <div class="field point">Loading...</div>
  <div class="field gender">Loading...</div>
  <div class="field od">Loading...</div>
  <div class="field players">
    <p class="player1name">Loading...</p>
    <p class="player1role">Loading...</p>
  </div>

<script>
  function handleSheetData(data) {
    // Log data to ensure it's being returned properly
    console.log(data);  // Add this to see what data is returned from the script

    document.querySelector('.point').innerText = data.point || "No Data";
    document.querySelector('.gender').innerText = data.gender || "No Data";
    document.querySelector('.od').innerText = data.od || "No Data";
    document.querySelector('.player1name').innerText = data.player1name || "No Data";
    document.querySelector('.player1role').innerText = data.player1role || "No Data";
  }

  // Function to fetch new data
  function fetchData() {
    const scriptUrl = "https://script.google.com/macros/s/AKfycby-P5mTRLSMClzzxEF7ExVFPXSybY95QhIL9BSU1d7t60Mz_vz6awJyIoxyLAg-aaw3_w/exec?callback=handleSheetData";
    
    // Dynamically add the script to call `handleSheetData` callback
    const script = document.createElement('script');
    script.src = scriptUrl;
    document.body.appendChild(script);
  }

  // Initial data fetch
  fetchData();

  // Set interval to refresh data every 30 seconds (30000 milliseconds)
  setInterval(fetchData, 30000);  // Adjust the 30000 value to your desired refresh rate (30 seconds)
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Data Fetch</title>
  <style>
    div {
      font-size: 16px;
      margin: 5px;
    }
  </style>
</head>
<body>

  <div class="i2">Loading I2...</div>
  <div class="t2">Loading T2...</div>
  <div class="y2">Loading Y2...</div>
  <div class="m14">Loading M14...</div>
  <div class="u14">Loading U14...</div>
  <div class="a8">Loading A8...</div>
  <div class="a10">Loading A10...</div>
  <div class="f8">Loading F8...</div>
  <div class="f11">Loading F11...</div>
  <div class="k8">Loading K8...</div>
  <div class="k11">Loading K11...</div>
  <div class="p8">Loading P8...</div>
  <div class="p11">Loading P11...</div>
  <div class="u8">Loading U8...</div>
  <div class="u11">Loading U11...</div>
  <div class="z8">Loading Z8...</div>
  <div class="z11">Loading Z11...</div>

  <button onclick="callFunction('addUS')">Add US</button>
  <button onclick="callFunction('addTHEM')">Add THEM</button>
  <button onclick="callFunction('lessUS')">Less US</button>
  <button onclick="callFunction('lessTHEM')">Less THEM</button>

  <script>
    async function fetchData() {
      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbyugeaFLLG6oKLwlQjntWIgr40JlySw3lmIUEKswinfSoepeW0GXK4qzIuOSopa249lzQ/exec');
        const data = await response.json();

        const fields = [
          'i2','t2','y2','m14','u14','a8','a10',
          'f8','f11','k8','k11','p8','p11',
          'u8','u11','z8','z11'
        ];

        fields.forEach(field => {
          const el = document.querySelector(`.${field}`);
          if (el) el.textContent = data[field] ?? `No data for ${field.toUpperCase()}`;
        });

      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function callFunction(name) {
      google.script.run[name]();
    }

    window.onload = fetchData;
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Data Fetch</title>
  <style>
    .field {
      font-size: 24px;
      font-weight: bold;
      color: #ff0000;
      margin: 20px;
    }
  </style>
</head>
<body>

  <div class="field point">Loading...</div>
  <div class="field gender">Loading...</div>
  <div class="field od">Loading...</div>
  <div class="field players">
    <p class="player1name">Loading...</p>
    <p class="player1role">Loading...</p>
  </div>

  <script>
    // Function to handle and update the data from the Google Sheets API
    function handleSheetData(data) {
      document.querySelector('.point').innerText = data.point;
      document.querySelector('.gender').innerText = data.gender;
      document.querySelector('.od').innerText = data.od;
      document.querySelector('.player1name').innerText = data.player1name;
      document.querySelector('.player1role').innerText = data.player1role;
    }

    // Function to fetch data from the Google Apps Script (API endpoint)
    function fetchData() {
      const scriptUrl = 'https://script.google.com/macros/s/AKfycby-P5mTRLSMClzzxEF7ExVFPXSybY95QhIL9BSU1d7t60Mz_vz6awJyIoxyLAg-aaw3_w/exec?callback=handleSheetData';
      const scriptTag = document.createElement('script');
      scriptTag.src = scriptUrl;
      document.body.appendChild(scriptTag);
    }

    // Initial data fetch on page load
    window.onload = function() {
      fetchData();

      // Auto-refresh every 30 seconds (30000 milliseconds)
      setInterval(fetchData, 30000); // Adjust time interval as needed
    };
  </script>

</body>
</html>
